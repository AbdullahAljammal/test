<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette Picker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <section id="title_section">
      <h1>COLOR PALETTE GENERATOR</h1>
    </section>

    <section id="control_section">
      <section id="inputs">
        <input type="text" id="palette_name" placeholder="Input Your Palette Name">
        <div id="color_inputs_holder">
          <input type="color" id="color1">
          <input type="color" id="color2">
          <input type="color" id="color3">
        </div>
      </section>

      <section id="buttons">
        <button id="save_button">Save Palette</button>
      </section>
    </section>

    <section id="saved_palettes_section">
      <!-- Example Palette Box -->
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
